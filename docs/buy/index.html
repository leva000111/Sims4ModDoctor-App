@media (prefers-color-scheme:dark){:root{--bg:#15121f;--bg2:#1d1830;--card:#221c35;--ink:#f1ecff;--ink2:#b5acd6;--line:#342c4f;--violet2:#2f2656;--mint2:#183a30;--sh:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}header img{width:44px;height:44px;border-radius:12px}
header b{font-size:20px;font-weight:900}header .sp{flex:1}
select{font:inherit;font-weight:700;font-size:14px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
h1{font-size:30px;line-height:1.2;margin:6px 0 8px;font-weight:900}.lead{color:var(--ink2);margin:0 0 18px}
.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media (max-width:560px){.plans{grid-template-columns:1fr}}
.plan{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;box-shadow:var(--sh);text-align:left;font:inherit;color:inherit}
.plan:hover,.plan.on{border-color:var(--violet)}.plan b{display:block;font-size:26px;font-weight:900}.plan span{color:var(--ink2);font-weight:700}
.plan.best{background:linear-gradient(135deg,var(--violet2),var(--bg2))}.tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--mint2);color:var(--mint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff}.btn.sec{background:var(--bg2);color:var(--ink)}
.key{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:800;letter-spacing:1px;background:var(--bg2);padding:12px;border-radius:12px;user-select:all;word-break:break-all;margin:10px 0}
.mut{color:var(--ink2);font-size:15px}.err{color:#d64545}.ok{color:var(--mint)}.hide{display:none}
ol{padding-left:22px}li{margin:4px 0}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--violet2);border-top-color:var(--violet);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}

const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const RU = ["ru", "be", "kk", "ky", "tg", "hy", "az", "uz"];
let lang = q.get("lang");
if (!T[lang]) { const b = String(navigator.language || "").toLowerCase().split("-")[0]; lang = RU.includes(b) ? "ru" : T[b] ? b : "en"; }
const renew = (q.get("renew") || "").trim();
let L = T[lang], PRICES = {month: "4.99", quarter: "11.99", year: "29.99", lifetime: "69.99"};
const ORDER = ["month", "quarter", "year", "lifetime"];

function paint() {
  L = T[lang]; document.documentElement.lang = lang;
  $("#t_h1").textContent = renew ? L.renew : L.h1; $("#t_lead").textContent = L.lead; $("#t_pay").textContent = L.pay;
  $("#t_wait").textContent = L.wait; $("#t_wait2").textContent = L.wait2; $("#paylink").textContent = L.open;
  $("#t_done").textContent = L.done; $("#copy").textContent = L.copy;
  $("#t_steps").innerHTML = L.steps.map(s => "<li>" + s.replace(/[<>&]/g, c => ({"<": "&lt;", ">": "&gt;", "&": "&amp;"}[c])) + "</li>").join("");
  $("#plans").innerHTML = ORDER.filter(id => !(renew && id === "lifetime") || true).map(id =>
    `<button class="plan${id === "lifetime" ? " best" : ""}" data-p="${id}"><span>${L[id]}${id === "lifetime" ? `<i class="tag">${L.best}</i>` : ""}</span><b>$${PRICES[id]}</b></button>`).join("");
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => buy(b.dataset.p));
}
const sel = $("#lang");
sel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}"${k === lang ? " selected" : ""}>${v}</option>`).join("");
sel.onchange = () => { lang = sel.value; paint(); };
paint();
fetch(API + "/").then(r => r.json()).then(d => { if (d && d.plans) { for (const k of ORDER) if (d.plans[k]) PRICES[k] = d.plans[k].usd; paint(); } }).catch(() => {});

let poll = 0;
async function buy(plan) {
  $("#err").textContent = ""; $("#done").classList.add("hide");
  try {
    const r = await fetch(API + "/v1/buy", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(renew ? {plan, key: renew} : {plan})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || L.err);
    try { localStorage.setItem("md_order", JSON.stringify({order: d.order, secret: d.secret, t: Date.now()})); } catch (e) { /* без памяти */ }
    $("#paylink").href = d.pay_url; $("#wait").classList.remove("hide");
    window.open(d.pay_url, "_blank", "noopener");
    watch(d.order, d.secret);
  } catch (e) { $("#err").textContent = e.message || L.err; }
}
function watch(order, secret) {
  clearInterval(poll);
  poll = setInterval(async () => {
    try {
      const d = await (await fetch(`${API}/v1/order?id=${encodeURIComponent(order)}&secret=${encodeURIComponent(secret)}`)).json();
      if (d.status === "paid") {
        clearInterval(poll); $("#wait").classList.add("hide"); $("#done").classList.remove("hide");
        $("#key").textContent = d.key || "";
        if (d.renewed) { $("#t_steps").innerHTML = "<li>" + L.renewed + "</li>"; }
        try { localStorage.removeItem("md_order"); } catch (e) { /* пусть */ }
      } else if (d.status === "expired") { clearInterval(poll); $("#wait").classList.add("hide"); $("#err").textContent = L.expired; }
    } catch (e) { /* сеть моргнула — спросим ещё раз */ }
  }, 5000);
}
$("#copy").onclick = async () => { try { await navigator.clipboard.writeText($("#key").textContent); $("#copy").textContent = L.copied; } catch (e) { /* выдели вручную */ } };
// незаконченная покупка (страницу перезагрузили) — продолжаю ждать
try { const o = JSON.parse(localStorage.getItem("md_order") || "null"); if (o && Date.now() - o.t < 3600e3) { $("#wait").classList.remove("hide"); watch(o.order, o.secret); } } catch (e) { /* пусть */ }
})();
</script>
