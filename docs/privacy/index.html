<script>
// Политика конфиденциальности. Тексты — по языкам; недостающий язык показывается по-английски.
const UPDATED = "2026-11-25";
const LANGS = {en: "English", ru: "Русский", pt: "Português", es: "Español", de: "Deutsch", fr: "Français", pl: "Polski", it: "Italiano", uk: "Українська"};
const T = {
en: {title: "Privacy Policy", updated: "Last updated", sections: [
 ["Who we are", "Sims 4 Mod Doctor is a free Windows program for The Sims 4 players, made by an independent developer. It is not affiliated with or endorsed by Electronic Arts or Maxis. Contact: the in-app button “Write to the developer”, or our Telegram community https://t.me/sims4moddoctor_chat."],
 ["What stays on your computer", "The program works with your Mods, Tray and saves folders locally. Settings, quarantine, backups and reports are stored on your computer (in Documents\\Sims 4 Mod Doctor and the program's local app data). Nothing from them is uploaded automatically."],
 ["What is sent, and only when", "1) PRO license: when you activate or refresh a PRO key, the program sends the key, an anonymous computer ID (a hash, not the Windows ID itself) and the computer name to our license server, to bind the key to one computer. The program also asks the server for current prices.\n2) Purchases: payment is made in Telegram through @CryptoBot (Crypto Pay). We receive only the order, plan, amount and the issued key — never your payment details.\n3) Error reports: in the version from the Microsoft Store — only if you turn them on (the app asks once); in the version downloaded from our website they are on by default after the app tells you about them, and you can turn them off in Settings at any time. A report contains the error, the program and game version and Windows version; your Windows user name is removed from paths; the list of mods and saves is not included. Reports are processed by the Sentry service.\n4) Messages to the developer: only when you press “Send” in “Write to the developer”. The message contains your text, the contact you entered (optional), the screenshots you attached and, if you tick it, the Help report (game version, mod list, recent game errors; your Windows user name is hidden). It is delivered to the developer through Telegram.\n5) Machine translation of mods: only when you start it, the mod texts are sent to Google Translate or DeepL (with your own DeepL key)."],
 ["How we use it", "Only to provide the program's features: check licenses, deliver your key, fix errors and answer your messages. We do not sell or share your data for advertising, and the program has no ads or tracking."],
 ["How long we keep it", "License records — while the license exists. Error reports — up to 90 days. Messages to the developer — as long as needed to help you; you can ask us to delete them."],
 ["Your choices", "Error reports can be turned off at any time in Settings. Sending messages, machine translation and PRO activation happen only when you do them. To ask for access to or deletion of your data, write to us via the in-app button or Telegram."],
 ["Children", "The program is meant for players of The Sims 4 (rated T/PEGI 12). We do not knowingly collect personal data from children under 13."],
 ["Security", "All data is sent over encrypted connections (HTTPS/TLS)."],
 ["Changes", "If this policy changes, we will update this page and the date above."]]},
ru: {title: "Политика конфиденциальности", updated: "Обновлено", sections: [
 ["Кто мы", "Sims 4 Mod Doctor — бесплатная программа для Windows для игроков The Sims 4 от независимого разработчика. Она не связана с Electronic Arts или Maxis и не одобрена ими. Связь: кнопка «Написать разработчику» в программе или наше сообщество в Telegram https://t.me/sims4moddoctor_chat."],
 ["Что остаётся на твоём компьютере", "Программа работает с папками Mods, Tray и сохранениями у тебя на компьютере. Настройки, карантин, копии и отчёты хранятся на компьютере (в «Документы\\Sims 4 Mod Doctor» и в локальных данных программы). Сами по себе они никуда не отправляются."],
 ["Что отправляется и только когда", "1) PRO-ключ: при включении или обновлении ключа программа отправляет на наш сервер ключей сам ключ, анонимный номер компьютера (хэш, а не сам идентификатор Windows) и имя компьютера — чтобы привязать ключ к одному компьютеру. Ещё программа спрашивает у сервера текущие цены.\n2) Покупка: оплата идёт в Telegram через @CryptoBot (Crypto Pay). Мы получаем только заказ, тариф, сумму и выданный ключ — платёжных данных мы не видим.\n3) Отчёты об ошибках: в версии из Microsoft Store — только если ты их включишь (программа спросит один раз); в версии с нашего сайта они включены по умолчанию после сообщения об этом, а выключить их можно в «Настройках» в любой момент. В отчёте — ошибка, версия программы, игры и Windows; имя пользователя Windows из путей убрано; список модов и сохранений не входит. Отчёты обрабатывает сервис Sentry.\n4) Сообщения разработчику: только когда ты нажимаешь «Отправить» в «Написать разработчику». В сообщении — твой текст, контакт (если указал(а)), приложенные скриншоты и, если отмечено, отчёт для помощи (версия игры, список модов, свежие ошибки игры; имя пользователя Windows скрыто). Оно приходит разработчику через Telegram.\n5) Машинный перевод модов: только когда ты его запускаешь — тексты мода уходят в Google Переводчик или DeepL (с твоим ключом DeepL)."],
 ["Зачем", "Только чтобы работали функции программы: проверка ключей, выдача ключа, исправление ошибок и ответы на твои сообщения. Мы не продаём данные и не передаём их для рекламы; рекламы и слежки в программе нет."],
 ["Сколько храним", "Данные ключа — пока ключ существует. Отчёты об ошибках — до 90 дней. Сообщения разработчику — пока они нужны, чтобы помочь; можно попросить удалить."],
 ["Твой выбор", "Отчёты об ошибках выключаются в «Настройках» в любой момент. Сообщения, машинный перевод и включение PRO происходят только по твоему действию. Чтобы узнать, какие данные о тебе есть, или удалить их, напиши нам кнопкой в программе или в Telegram."],
 ["Дети", "Программа для игроков The Sims 4 (рейтинг T/PEGI 12). Мы сознательно не собираем данные детей младше 13 лет."],
 ["Безопасность", "Все данные передаются по защищённому соединению (HTTPS/TLS)."],
 ["Изменения", "Если политика изменится, мы обновим эту страницу и дату выше."]]},
pt: {title: "Política de Privacidade", updated: "Última atualização", sections: [
 ["Quem somos", "O Sims 4 Mod Doctor é um programa gratuito para Windows para jogadores de The Sims 4, feito por um desenvolvedor independente. Ele não é afiliado nem endossado pela Electronic Arts ou pela Maxis. Contato: o botão “Escrever ao desenvolvedor” no programa ou nossa comunidade no Telegram https://t.me/sims4moddoctor_chat."],
 ["O que fica no seu computador", "O programa trabalha localmente com as suas pastas Mods, Tray e de saves. Configurações, quarentena, backups e relatórios ficam armazenados no seu computador (em Documents\\Sims 4 Mod Doctor e nos dados locais do programa). Nada disso é enviado automaticamente."],
 ["O que é enviado, e somente quando", "1) Licença PRO: quando você ativa ou renova uma chave PRO, o programa envia a chave, um ID anônimo do computador (um hash, não o ID do Windows em si) e o nome do computador ao nosso servidor de licenças, para vincular a chave a um único computador. O programa também pede ao servidor os preços atuais.\n2) Compras: o pagamento é feito no Telegram por meio do @CryptoBot (Crypto Pay). Recebemos apenas o pedido, o plano, o valor e a chave emitida — nunca os seus dados de pagamento.\n3) Relatórios de erro: na versão da Microsoft Store — somente se você os ativar (o programa pergunta uma vez); na versão baixada do nosso site, eles vêm ativados por padrão depois que o programa avisa você, e você pode desativá-los em Configurações a qualquer momento. Um relatório contém o erro, a versão do programa e do jogo e a versão do Windows; o seu nome de usuário do Windows é removido dos caminhos; a lista de mods e de saves não é incluída. Os relatórios são processados pelo serviço Sentry.\n4) Mensagens ao desenvolvedor: somente quando você pressiona “Enviar” em “Escrever ao desenvolvedor”. A mensagem contém o seu texto, o contato que você informou (opcional), as capturas de tela anexadas e, se você marcar, o Relatório de ajuda (versão do jogo, lista de mods, erros recentes do jogo; o seu nome de usuário do Windows fica oculto). Ela é entregue ao desenvolvedor pelo Telegram.\n5) Tradução automática de mods: somente quando você a inicia, os textos do mod são enviados ao Google Translate ou ao DeepL (com a sua própria chave do DeepL)."],
 ["Como usamos", "Somente para oferecer as funções do programa: verificar licenças, entregar a sua chave, corrigir erros e responder às suas mensagens. Não vendemos nem compartilhamos os seus dados para publicidade, e o programa não tem anúncios nem rastreamento."],
 ["Por quanto tempo guardamos", "Registros de licença — enquanto a licença existir. Relatórios de erro — até 90 dias. Mensagens ao desenvolvedor — pelo tempo necessário para te ajudar; você pode pedir que sejam apagadas."],
 ["Suas escolhas", "Os relatórios de erro podem ser desativados a qualquer momento em Configurações. O envio de mensagens, a tradução automática e a ativação do PRO só acontecem quando você os faz. Para pedir acesso aos seus dados ou a exclusão deles, escreva para nós pelo botão do programa ou pelo Telegram."],
 ["Crianças", "O programa é destinado a jogadores de The Sims 4 (classificação T/PEGI 12). Não coletamos intencionalmente dados pessoais de crianças com menos de 13 anos."],
 ["Segurança", "Todos os dados são enviados por conexões criptografadas (HTTPS/TLS)."],
 ["Alterações", "Se esta política mudar, atualizaremos esta página e a data acima."]]},
es: {title: "Política de privacidad", updated: "Última actualización", sections: [
 ["Quiénes somos", "Sims 4 Mod Doctor es un programa gratuito para Windows para jugadores de Los Sims 4, creado por un desarrollador independiente. No está afiliado ni respaldado por Electronic Arts ni Maxis. Contacto: el botón «Escribir al desarrollador» del programa o nuestra comunidad de Telegram https://t.me/sims4moddoctor_chat."],
 ["Qué se queda en tu ordenador", "El programa trabaja de forma local con tus carpetas Mods, Tray y de partidas guardadas. Los ajustes, la cuarentena, las copias de seguridad y los informes se guardan en tu ordenador (en Documents\\Sims 4 Mod Doctor y en los datos locales del programa). Nada de eso se envía automáticamente."],
 ["Qué se envía, y solo cuándo", "1) Licencia PRO: cuando activas o renuevas una clave PRO, el programa envía la clave, un ID anónimo del equipo (un hash, no el ID de Windows en sí) y el nombre del equipo a nuestro servidor de licencias, para vincular la clave a un solo equipo. El programa también consulta al servidor los precios actuales.\n2) Compras: el pago se hace en Telegram mediante @CryptoBot (Crypto Pay). Solo recibimos el pedido, el plan, el importe y la clave emitida; nunca tus datos de pago.\n3) Informes de errores: en la versión de Microsoft Store, solo si los activas (el programa te lo pregunta una vez); en la versión descargada de nuestro sitio web vienen activados por defecto después de que el programa te lo comunique, y puedes desactivarlos en Ajustes en cualquier momento. Un informe contiene el error, la versión del programa y del juego y la versión de Windows; tu nombre de usuario de Windows se elimina de las rutas; no se incluye la lista de mods ni de partidas. Los informes los procesa el servicio Sentry.\n4) Mensajes al desarrollador: solo cuando pulsas «Enviar» en «Escribir al desarrollador». El mensaje contiene tu texto, el contacto que indicaste (opcional), las capturas de pantalla adjuntas y, si lo marcas, el Informe para ayuda (versión del juego, lista de mods, errores recientes del juego; tu nombre de usuario de Windows queda oculto). Se entrega al desarrollador a través de Telegram.\n5) Traducción automática de mods: solo cuando la inicias, los textos del mod se envían a Google Translate o DeepL (con tu propia clave de DeepL)."],
 ["Cómo lo usamos", "Solo para ofrecer las funciones del programa: comprobar licencias, entregar tu clave, corregir errores y responder a tus mensajes. No vendemos ni compartimos tus datos con fines publicitarios, y el programa no tiene anuncios ni rastreo."],
 ["Cuánto tiempo lo conservamos", "Registros de licencia: mientras exista la licencia. Informes de errores: hasta 90 días. Mensajes al desarrollador: el tiempo necesario para ayudarte; puedes pedirnos que los borremos."],
 ["Tus opciones", "Los informes de errores se pueden desactivar en cualquier momento en Ajustes. El envío de mensajes, la traducción automática y la activación de PRO solo ocurren cuando tú los haces. Para solicitar acceso a tus datos o su eliminación, escríbenos con el botón del programa o por Telegram."],
 ["Menores", "El programa está pensado para jugadores de Los Sims 4 (clasificación T/PEGI 12). No recopilamos a sabiendas datos personales de menores de 13 años."],
 ["Seguridad", "Todos los datos se envían mediante conexiones cifradas (HTTPS/TLS)."],
 ["Cambios", "Si esta política cambia, actualizaremos esta página y la fecha de arriba."]]},
de: {title: "Datenschutzerklärung", updated: "Zuletzt aktualisiert", sections: [
 ["Wer wir sind", "Sims 4 Mod Doctor ist ein kostenloses Windows-Programm für Spieler von Die Sims 4, entwickelt von einem unabhängigen Entwickler. Es steht in keiner Verbindung zu Electronic Arts oder Maxis und wird von ihnen nicht unterstützt. Kontakt: die Schaltfläche „An den Entwickler schreiben“ im Programm oder unsere Telegram-Community https://t.me/sims4moddoctor_chat."],
 ["Was auf deinem Computer bleibt", "Das Programm arbeitet lokal mit deinen Ordnern Mods, Tray und Spielstände. Einstellungen, Quarantäne, Sicherungen und Berichte werden auf deinem Computer gespeichert (in Documents\\Sims 4 Mod Doctor und in den lokalen Programmdaten). Nichts davon wird automatisch hochgeladen."],
 ["Was gesendet wird, und nur wann", "1) PRO-Lizenz: Wenn du einen PRO-Schlüssel aktivierst oder erneuerst, sendet das Programm den Schlüssel, eine anonyme Computer-ID (ein Hash, nicht die Windows-ID selbst) und den Computernamen an unseren Lizenzserver, um den Schlüssel an einen Computer zu binden. Außerdem fragt das Programm beim Server die aktuellen Preise ab.\n2) Käufe: Die Zahlung erfolgt in Telegram über @CryptoBot (Crypto Pay). Wir erhalten nur Bestellung, Tarif, Betrag und den ausgestellten Schlüssel – niemals deine Zahlungsdaten.\n3) Fehlerberichte: In der Version aus dem Microsoft Store nur, wenn du sie einschaltest (das Programm fragt einmal nach); in der von unserer Website heruntergeladenen Version sind sie standardmäßig eingeschaltet, nachdem das Programm dich darüber informiert hat, und du kannst sie jederzeit in den Einstellungen ausschalten. Ein Bericht enthält den Fehler, die Programm- und Spielversion sowie die Windows-Version; dein Windows-Benutzername wird aus Pfaden entfernt; die Liste der Mods und Spielstände ist nicht enthalten. Die Berichte werden vom Dienst Sentry verarbeitet.\n4) Nachrichten an den Entwickler: nur, wenn du in „An den Entwickler schreiben“ auf „Senden“ drückst. Die Nachricht enthält deinen Text, den von dir eingegebenen Kontakt (optional), die angehängten Screenshots und, wenn du es ankreuzt, den Hilfebericht (Spielversion, Mod-Liste, aktuelle Spielfehler; dein Windows-Benutzername wird verborgen). Sie wird über Telegram an den Entwickler zugestellt.\n5) Maschinelle Übersetzung von Mods: nur wenn du sie startest, werden die Mod-Texte an Google Translate oder DeepL gesendet (mit deinem eigenen DeepL-Schlüssel)."],
 ["Wie wir sie verwenden", "Nur um die Funktionen des Programms bereitzustellen: Lizenzen prüfen, deinen Schlüssel zustellen, Fehler beheben und deine Nachrichten beantworten. Wir verkaufen oder teilen deine Daten nicht für Werbung, und das Programm enthält weder Werbung noch Tracking."],
 ["Wie lange wir sie speichern", "Lizenzdaten – solange die Lizenz besteht. Fehlerberichte – bis zu 90 Tage. Nachrichten an den Entwickler – so lange, wie nötig, um dir zu helfen; du kannst uns bitten, sie zu löschen."],
 ["Deine Wahlmöglichkeiten", "Fehlerberichte kannst du jederzeit in den Einstellungen ausschalten. Das Senden von Nachrichten, die maschinelle Übersetzung und die PRO-Aktivierung geschehen nur, wenn du sie auslöst. Um Auskunft über deine Daten oder deren Löschung zu verlangen, schreib uns über die Schaltfläche im Programm oder über Telegram."],
 ["Kinder", "Das Programm richtet sich an Spieler von Die Sims 4 (Einstufung T/PEGI 12). Wir erheben wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren."],
 ["Sicherheit", "Alle Daten werden über verschlüsselte Verbindungen (HTTPS/TLS) übertragen."],
 ["Änderungen", "Wenn sich diese Richtlinie ändert, aktualisieren wir diese Seite und das obige Datum."]]},
fr: {title: "Politique de confidentialité", updated: "Dernière mise à jour", sections: [
 ["Qui nous sommes", "Sims 4 Mod Doctor est un programme Windows gratuit pour les joueurs des Sims 4, créé par un développeur indépendant. Il n'est ni affilié à Electronic Arts ou Maxis, ni approuvé par eux. Contact : le bouton « Écrire au développeur » dans le programme ou notre communauté Telegram https://t.me/sims4moddoctor_chat."],
 ["Ce qui reste sur ton ordinateur", "Le programme travaille en local avec tes dossiers Mods, Tray et de sauvegardes. Les paramètres, la quarantaine, les copies de sauvegarde et les rapports sont stockés sur ton ordinateur (dans Documents\\Sims 4 Mod Doctor et dans les données locales du programme). Rien de tout cela n'est envoyé automatiquement."],
 ["Ce qui est envoyé, et seulement quand", "1) Licence PRO : quand tu actives ou renouvelles une clé PRO, le programme envoie la clé, un identifiant anonyme de l'ordinateur (un hash, pas l'identifiant Windows lui-même) et le nom de l'ordinateur à notre serveur de licences, pour lier la clé à un seul ordinateur. Le programme demande aussi les prix actuels au serveur.\n2) Achats : le paiement se fait dans Telegram via @CryptoBot (Crypto Pay). Nous recevons uniquement la commande, l'offre, le montant et la clé délivrée — jamais tes données de paiement.\n3) Rapports d'erreurs : dans la version du Microsoft Store, uniquement si tu les actives (le programme te demande une seule fois) ; dans la version téléchargée depuis notre site, ils sont activés par défaut après que le programme t'en a informé, et tu peux les désactiver dans Paramètres à tout moment. Un rapport contient l'erreur, la version du programme et du jeu et la version de Windows ; ton nom d'utilisateur Windows est retiré des chemins ; la liste des mods et des sauvegardes n'est pas incluse. Les rapports sont traités par le service Sentry.\n4) Messages au développeur : uniquement quand tu appuies sur « Envoyer » dans « Écrire au développeur ». Le message contient ton texte, le contact que tu as saisi (facultatif), les captures d'écran jointes et, si tu la coches, le Rapport d'aide (version du jeu, liste des mods, erreurs récentes du jeu ; ton nom d'utilisateur Windows est masqué). Il est transmis au développeur via Telegram.\n5) Traduction automatique des mods : uniquement quand tu la lances, les textes du mod sont envoyés à Google Translate ou DeepL (avec ta propre clé DeepL)."],
 ["Comment nous l'utilisons", "Uniquement pour fournir les fonctions du programme : vérifier les licences, livrer ta clé, corriger les erreurs et répondre à tes messages. Nous ne vendons ni ne partageons tes données à des fins publicitaires, et le programme ne contient ni publicité ni suivi."],
 ["Combien de temps nous les conservons", "Enregistrements de licence — tant que la licence existe. Rapports d'erreurs — jusqu'à 90 jours. Messages au développeur — le temps nécessaire pour t'aider ; tu peux nous demander de les supprimer."],
 ["Tes choix", "Les rapports d'erreurs peuvent être désactivés à tout moment dans Paramètres. L'envoi de messages, la traduction automatique et l'activation PRO n'ont lieu que lorsque tu les déclenches. Pour demander l'accès à tes données ou leur suppression, écris-nous via le bouton du programme ou sur Telegram."],
 ["Enfants", "Le programme est destiné aux joueurs des Sims 4 (classé T/PEGI 12). Nous ne collectons pas sciemment de données personnelles d'enfants de moins de 13 ans."],
 ["Sécurité", "Toutes les données sont envoyées via des connexions chiffrées (HTTPS/TLS)."],
 ["Modifications", "Si cette politique change, nous mettrons à jour cette page et la date ci-dessus."]]},
pl: {title: "Polityka prywatności", updated: "Ostatnia aktualizacja", sections: [
 ["Kim jesteśmy", "Sims 4 Mod Doctor to darmowy program dla Windows dla graczy The Sims 4, stworzony przez niezależnego twórcę. Nie jest powiązany z Electronic Arts ani Maxis ani przez nie popierany. Kontakt: przycisk „Napisz do twórcy” w programie lub nasza społeczność na Telegramie https://t.me/sims4moddoctor_chat."],
 ["Co zostaje na twoim komputerze", "Program działa lokalnie na twoich folderach Mods, Tray i zapisów gry. Ustawienia, kwarantanna, kopie zapasowe i raporty są przechowywane na twoim komputerze (w Documents\\Sims 4 Mod Doctor oraz w lokalnych danych programu). Nic z tego nie jest wysyłane automatycznie."],
 ["Co jest wysyłane i tylko kiedy", "1) Licencja PRO: gdy aktywujesz lub odświeżasz klucz PRO, program wysyła klucz, anonimowy identyfikator komputera (hasz, a nie sam identyfikator Windows) i nazwę komputera na nasz serwer licencji, aby powiązać klucz z jednym komputerem. Program pyta też serwer o aktualne ceny.\n2) Zakupy: płatność odbywa się w Telegramie przez @CryptoBot (Crypto Pay). Otrzymujemy tylko zamówienie, plan, kwotę i wydany klucz — nigdy twoich danych płatniczych.\n3) Raporty błędów: w wersji z Microsoft Store — tylko jeśli je włączysz (program zapyta raz); w wersji pobranej z naszej strony są domyślnie włączone po tym, jak program cię o tym poinformuje, a w Ustawieniach możesz je wyłączyć w dowolnej chwili. Raport zawiera błąd, wersję programu i gry oraz wersję Windows; twoja nazwa użytkownika Windows jest usuwana ze ścieżek; lista modów i zapisów gry nie jest dołączana. Raporty przetwarza usługa Sentry.\n4) Wiadomości do twórcy: tylko gdy naciśniesz „Wyślij” w „Napisz do twórcy”. Wiadomość zawiera twój tekst, podany przez ciebie kontakt (opcjonalnie), dołączone zrzuty ekranu oraz, jeśli to zaznaczysz, Raport dla pomocy (wersja gry, lista modów, ostatnie błędy gry; twoja nazwa użytkownika Windows jest ukryta). Trafia do twórcy przez Telegram.\n5) Automatyczne tłumaczenie modów: tylko gdy je uruchomisz, teksty moda są wysyłane do Google Translate lub DeepL (z twoim własnym kluczem DeepL)."],
 ["Jak tego używamy", "Tylko po to, by zapewnić funkcje programu: sprawdzać licencje, dostarczać twój klucz, naprawiać błędy i odpowiadać na twoje wiadomości. Nie sprzedajemy ani nie udostępniamy twoich danych w celach reklamowych, a program nie zawiera reklam ani śledzenia."],
 ["Jak długo je przechowujemy", "Dane licencji — dopóki licencja istnieje. Raporty błędów — do 90 dni. Wiadomości do twórcy — tak długo, jak trzeba, by ci pomóc; możesz poprosić o ich usunięcie."],
 ["Twoje wybory", "Raporty błędów możesz wyłączyć w dowolnej chwili w Ustawieniach. Wysyłanie wiadomości, automatyczne tłumaczenie i aktywacja PRO odbywają się tylko wtedy, gdy sam je uruchomisz. Aby poprosić o dostęp do swoich danych lub ich usunięcie, napisz do nas przyciskiem w programie lub przez Telegram."],
 ["Dzieci", "Program jest przeznaczony dla graczy The Sims 4 (klasyfikacja T/PEGI 12). Świadomie nie zbieramy danych osobowych dzieci poniżej 13 roku życia."],
 ["Bezpieczeństwo", "Wszystkie dane są przesyłane szyfrowanymi połączeniami (HTTPS/TLS)."],
 ["Zmiany", "Jeśli ta polityka ulegnie zmianie, zaktualizujemy tę stronę i powyższą datę."]]},
it: {title: "Informativa sulla privacy", updated: "Ultimo aggiornamento", sections: [
 ["Chi siamo", "Sims 4 Mod Doctor è un programma gratuito per Windows per i giocatori di The Sims 4, creato da uno sviluppatore indipendente. Non è affiliato né approvato da Electronic Arts o Maxis. Contatto: il pulsante «Scrivi allo sviluppatore» nel programma oppure la nostra community Telegram https://t.me/sims4moddoctor_chat."],
 ["Cosa resta sul tuo computer", "Il programma lavora in locale con le tue cartelle Mods, Tray e dei salvataggi. Impostazioni, quarantena, backup e report sono archiviati sul tuo computer (in Documents\\Sims 4 Mod Doctor e nei dati locali del programma). Niente di tutto ciò viene caricato automaticamente."],
 ["Cosa viene inviato, e solo quando", "1) Licenza PRO: quando attivi o rinnovi una chiave PRO, il programma invia la chiave, un ID anonimo del computer (un hash, non l'ID di Windows stesso) e il nome del computer al nostro server delle licenze, per associare la chiave a un solo computer. Il programma chiede inoltre al server i prezzi attuali.\n2) Acquisti: il pagamento avviene su Telegram tramite @CryptoBot (Crypto Pay). Riceviamo solo l'ordine, il piano, l'importo e la chiave emessa — mai i tuoi dati di pagamento.\n3) Report degli errori: nella versione del Microsoft Store — solo se li attivi (il programma te lo chiede una volta); nella versione scaricata dal nostro sito sono attivi per impostazione predefinita dopo che il programma te lo ha comunicato, e puoi disattivarli nelle Impostazioni in qualsiasi momento. Un report contiene l'errore, la versione del programma e del gioco e la versione di Windows; il tuo nome utente di Windows viene rimosso dai percorsi; l'elenco di mod e salvataggi non è incluso. I report sono elaborati dal servizio Sentry.\n4) Messaggi allo sviluppatore: solo quando premi «Invia» in «Scrivi allo sviluppatore». Il messaggio contiene il tuo testo, il contatto che hai inserito (facoltativo), gli screenshot allegati e, se lo spunti, il Report per l'assistenza (versione del gioco, elenco delle mod, errori recenti del gioco; il tuo nome utente di Windows è nascosto). Viene consegnato allo sviluppatore tramite Telegram.\n5) Traduzione automatica delle mod: solo quando la avvii, i testi della mod vengono inviati a Google Translate o DeepL (con la tua chiave DeepL personale)."],
 ["Come li usiamo", "Solo per fornire le funzioni del programma: verificare le licenze, consegnare la tua chiave, correggere gli errori e rispondere ai tuoi messaggi. Non vendiamo né condividiamo i tuoi dati per scopi pubblicitari, e il programma non contiene pubblicità né tracciamento."],
 ["Per quanto tempo li conserviamo", "Dati della licenza — finché la licenza esiste. Report degli errori — fino a 90 giorni. Messaggi allo sviluppatore — per il tempo necessario ad aiutarti; puoi chiederci di eliminarli."],
 ["Le tue scelte", "I report degli errori possono essere disattivati in qualsiasi momento nelle Impostazioni. L'invio di messaggi, la traduzione automatica e l'attivazione PRO avvengono solo quando li esegui tu. Per chiedere l'accesso ai tuoi dati o la loro cancellazione, scrivici con il pulsante nel programma o su Telegram."],
 ["Minori", "Il programma è pensato per i giocatori di The Sims 4 (classificato T/PEGI 12). Non raccogliamo consapevolmente dati personali di minori di 13 anni."],
 ["Sicurezza", "Tutti i dati vengono inviati tramite connessioni crittografate (HTTPS/TLS)."],
 ["Modifiche", "Se questa informativa cambia, aggiorneremo questa pagina e la data qui sopra."]]},
uk: {title: "Політика конфіденційності", updated: "Оновлено", sections: [
 ["Хто ми", "Sims 4 Mod Doctor — безкоштовна програма для Windows для гравців The Sims 4 від незалежного розробника. Вона не пов'язана з Electronic Arts чи Maxis і не схвалена ними. Зв'язок: кнопка «Написати розробнику» в програмі або наша спільнота в Telegram https://t.me/sims4moddoctor_chat."],
 ["Що залишається на твоєму комп'ютері", "Програма працює з папками Mods, Tray і збереженнями на твоєму комп'ютері. Налаштування, карантин, копії та звіти зберігаються на комп'ютері (у Documents\\Sims 4 Mod Doctor і в локальних даних програми). Самі по собі вони нікуди не надсилаються."],
 ["Що надсилається і тільки коли", "1) PRO-ключ: під час увімкнення або оновлення ключа програма надсилає на наш сервер ліцензій сам ключ, анонімний номер комп'ютера (геш, а не сам ідентифікатор Windows) та ім'я комп'ютера — щоб прив'язати ключ до одного комп'ютера. Також програма запитує в сервера поточні ціни.\n2) Покупка: оплата відбувається в Telegram через @CryptoBot (Crypto Pay). Ми отримуємо лише замовлення, тариф, суму та виданий ключ — платіжних даних ми не бачимо.\n3) Звіти про помилки: у версії з Microsoft Store — тільки якщо ти їх увімкнеш (програма запитає один раз); у версії з нашого сайту вони ввімкнені за замовчуванням після повідомлення про це, а вимкнути їх можна в «Налаштуваннях» у будь-який момент. У звіті — помилка, версія програми, гри та Windows; ім'я користувача Windows зі шляхів прибрано; список модів і збережень не входить. Звіти обробляє сервіс Sentry.\n4) Повідомлення розробнику: тільки коли ти натискаєш «Надіслати» в «Написати розробнику». У повідомленні — твій текст, контакт (якщо вказав(-ла)), прикріплені скриншоти і, якщо позначено, Звіт для допомоги (версія гри, список модів, свіжі помилки гри; ім'я користувача Windows приховано). Воно надходить розробнику через Telegram.\n5) Машинний переклад модів: тільки коли ти його запускаєш — тексти моду надсилаються до Google Translate або DeepL (з твоїм ключем DeepL)."],
 ["Навіщо", "Лише щоб працювали функції програми: перевірка ключів, видача ключа, виправлення помилок і відповіді на твої повідомлення. Ми не продаємо дані й не передаємо їх для реклами; реклами та стеження в програмі немає."],
 ["Скільки зберігаємо", "Дані ключа — поки ключ існує. Звіти про помилки — до 90 днів. Повідомлення розробнику — поки вони потрібні, щоб допомогти; можна попросити видалити."],
 ["Твій вибір", "Звіти про помилки вимикаються в «Налаштуваннях» будь-коли. Повідомлення, машинний переклад і активація PRO відбуваються лише за твоєю дією. Щоб дізнатися, які дані про тебе є, або видалити їх, напиши нам кнопкою в програмі або в Telegram."],
 ["Діти", "Програма для гравців The Sims 4 (рейтинг T/PEGI 12). Ми свідомо не збираємо дані дітей молодше 13 років."],
 ["Безпека", "Усі дані передаються захищеним з'єднанням (HTTPS/TLS)."],
 ["Зміни", "Якщо політика зміниться, ми оновимо цю сторінку та дату вище."]]},
};
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
let lang = q.get("lang"); if (!LANGS[lang]) { const b = String(navigator.language || "").toLowerCase().split("-")[0]; lang = ["ru", "be", "kk"].includes(b) ? "ru" : LANGS[b] ? b : "en"; }
const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const link = s => esc(s).replace(/https:\/\/[^\s<]+/g, u => `<a href="${u}">${u}</a>`).replace(/\n/g, "<br>");
function paint() {
  const L = T[lang] || T.en; document.documentElement.lang = T[lang] ? lang : "en";
  document.title = "Sims 4 Mod Doctor — " + L.title;
  $("#doc").innerHTML = `<h1>${esc(L.title)}</h1><p class="mut">${esc(L.updated)}: ${UPDATED}</p>` +
    L.sections.map(([h, p]) => `<section><h2>${esc(h)}</h2><p>${link(p)}</p></section>`).join("");
}
const sel = $("#lang");
sel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}"${k === lang ? " selected" : ""}>${v}</option>`).join("");
sel.onchange = () => { lang = sel.value; paint(); };
paint();
</script>
</body>
