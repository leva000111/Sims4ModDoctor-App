<script>
// Политика конфиденциальности. Тексты — по языкам; недостающий язык показывается по-английски.
const UPDATED = "2026-11-26";
const LANGS = {en: "English", ru: "Русский", pt: "Português", es: "Español", de: "Deutsch", fr: "Français", pl: "Polski", it: "Italiano", uk: "Українська"};
const T = {
en: {title: "Privacy Policy", updated: "Last updated", sections: [
 ["Who we are", "Sims 4 Mod Doctor is a free Windows program for The Sims 4 players, made by an independent developer. It is not affiliated with or endorsed by Electronic Arts or Maxis. Contact: the in-app button “Write to the developer”, or our Telegram community https://t.me/sims4moddoctor_chat."],
 ["What stays on your computer", "The program works with your Mods, Tray and saves folders locally. Settings, quarantine, backups and reports are stored on your computer (in Documents\\Sims 4 Mod Doctor and the program's local app data). Nothing from them is uploaded automatically."],
 ["What is sent, and only when", "1) PRO license: when you activate or refresh a PRO key, the program sends the key, an anonymous computer ID (a hash, not the Windows ID itself) and a short label like “Computer 1A2B” (made from that ID, not your real computer name) to our license server, to bind the key to one computer. The program also asks the server for current prices.\n2) Purchases: payment is made in Telegram through @CryptoBot (Crypto Pay). We receive only the order, plan, amount and the issued key — never your payment details.\n3) Error reports: in the version from the Microsoft Store — only if you turn them on (the app asks once); in the version downloaded from our website they are on by default after the app tells you about them, and you can turn them off in Settings at any time. A report contains the error, the program and game version and Windows version; your Windows user name is removed from paths; the list of mods and saves is not included. Reports are processed by the Sentry service.\n4) Messages to the developer: only when you press “Send” in “Write to the developer”. The message contains your text, the contact you entered (optional), the screenshots you attached and, if you tick it, the Help report (game version, mod list, recent game errors; your Windows user name is hidden). It is delivered to the developer through Telegram.\n5) Machine translation of mods: only when you start it, the mod texts are sent to Google Translate or DeepL (with your own DeepL key).\n6) Friend invitations: if you have ever opened “🎁 Invite a friend”, every 6 hours the program asks the license server whether someone bought through your link and collects the days you earned. It sends the anonymous computer ID, your key (if you have one) and your invitation code."],
 ["How we use it", "Only to provide the program's features: check licenses, deliver your key, fix errors and answer your messages. We do not sell or share your data for advertising, and the program has no ads or tracking."],
 ["How long we keep it", "License records — while the license exists. Error reports — up to 90 days. Messages to the developer — as long as needed to help you; you can ask us to delete them. Request counters that protect against brute force (by an address fingerprint, not the address itself) — from minutes to a day."],
 ["Invitations from friends", "So that nobody “invites” themselves, the license server keeps fingerprints of internet addresses (a one-way hash with a secret salt, not the address itself; for IPv6 — of its network part). A fingerprint is recorded: 1) if you have an invitation code — when the program contacts the license server: when you open “Invite a friend”, during the invitation check every 6 hours, and when your key is activated or refreshed; 2) if you buy a new key through a friend's link or code — the address the key was bought from. The address a friend activates a key from is compared with the fingerprints but not saved. Each fingerprint is kept for no more than 60 days from the moment it was recorded: after that the server no longer uses it and deletes it, and records a new one on the next contact. The server also remembers which keys have been activated on a computer (by the anonymous computer ID), so that a new key bought instead of a renewal does not count as an invitation."],
 ["Launch statistics", "Each time the program starts, together with the price request it sends to our license server: a random installation number (created once on your computer; it is not your computer ID and is not linked to it), the program version, the interface language, where the program came from (Microsoft Store or our website) and whether PRO is active. No name, no mod list, no saves. The server keeps only a fingerprint of the installation number (a one-way hash, not the number itself) and does not store your internet address; a start is counted at most once a day, and records older than 90 days are deleted automatically. It helps us understand how many people use the program. You can turn it off at any time in Settings: “Send anonymous launch statistics”."],
 ["Your choices", "Error reports can be turned off at any time in Settings. Sending messages, machine translation and PRO activation happen only when you do them. To ask for access to or deletion of your data, write to us via the in-app button or Telegram."],
 ["Children", "The program is meant for players of The Sims 4 (rated T/PEGI 12). We do not knowingly collect personal data from children under 13."],
 ["Security", "All data is sent over encrypted connections (HTTPS/TLS)."],
 ["Changes", "If this policy changes, we will update this page and the date above."]]},
ru: {title: "Политика конфиденциальности", updated: "Обновлено", sections: [
 ["Кто мы", "Sims 4 Mod Doctor — бесплатная программа для Windows для игроков The Sims 4 от независимого разработчика. Она не связана с Electronic Arts или Maxis и не одобрена ими. Связь: кнопка «Написать разработчику» в программе или наше сообщество в Telegram https://t.me/sims4moddoctor_chat."],
 ["Что остаётся на твоём компьютере", "Программа работает с папками Mods, Tray и сохранениями у тебя на компьютере. Настройки, карантин, копии и отчёты хранятся на компьютере (в «Документы\\Sims 4 Mod Doctor» и в локальных данных программы). Сами по себе они никуда не отправляются."],
 ["Что отправляется и только когда", "1) PRO-ключ: при включении или обновлении ключа программа отправляет на наш сервер ключей сам ключ, анонимный номер компьютера (хэш, а не сам идентификатор Windows) и короткую подпись вида «Компьютер 1A2B» (из того же номера, а не настоящее имя компьютера) — чтобы привязать ключ к одному компьютеру. Ещё программа спрашивает у сервера текущие цены.\n2) Покупка: оплата идёт в Telegram через @CryptoBot (Crypto Pay). Мы получаем только заказ, тариф, сумму и выданный ключ — платёжных данных мы не видим.\n3) Отчёты об ошибках: в версии из Microsoft Store — только если ты их включишь (программа спросит один раз); в версии с нашего сайта они включены по умолчанию после сообщения об этом, а выключить их можно в «Настройках» в любой момент. В отчёте — ошибка, версия программы, игры и Windows; имя пользователя Windows из путей убрано; список модов и сохранений не входит. Отчёты обрабатывает сервис Sentry.\n4) Сообщения разработчику: только когда ты нажимаешь «Отправить» в «Написать разработчику». В сообщении — твой текст, контакт (если указал(а)), приложенные скриншоты и, если отмечено, отчёт для помощи (версия игры, список модов, свежие ошибки игры; имя пользователя Windows скрыто). Оно приходит разработчику через Telegram.\n5) Машинный перевод модов: только когда ты его запускаешь — тексты мода уходят в Google Переводчик или DeepL (с твоим ключом DeepL).\n6) Приглашения друзей: если ты хоть раз открывал(а) «🎁 Пригласи друга», раз в 6 часов программа спрашивает сервер ключей, не купил ли кто по твоей ссылке, и забирает начисленные дни. Отправляются анонимный номер компьютера, твой ключ (если есть) и твой код приглашения."],
 ["Зачем", "Только чтобы работали функции программы: проверка ключей, выдача ключа, исправление ошибок и ответы на твои сообщения. Мы не продаём данные и не передаём их для рекламы; рекламы и слежки в программе нет."],
 ["Сколько храним", "Данные ключа — пока ключ существует. Отчёты об ошибках — до 90 дней. Сообщения разработчику — пока они нужны, чтобы помочь; можно попросить удалить. Счётчики защиты от перебора (по отпечатку адреса, а не по самому адресу) — от нескольких минут до суток."],
 ["Приглашения друзей", "Чтобы человек не «приглашал» сам себя, сервер ключей хранит отпечатки адресов в интернете (необратимый хэш с секретной солью, а не сам адрес; для IPv6 — его сетевой части). Отпечаток записывается: 1) если у тебя есть код приглашения — когда программа обращается к серверу ключей: при открытии «Пригласи друга», при проверке приглашений раз в 6 часов, при включении и обновлении ключа; 2) если ты покупаешь новый ключ по ссылке или коду друга — адрес, с которого куплен ключ. Адрес, с которого друг включает ключ, сравнивается с отпечатками, но не сохраняется. Каждый отпечаток хранится не дольше 60 дней с момента записи: потом сервер его больше не учитывает и удаляет, а при следующем обращении записывает новый. Ещё сервер помнит, какие ключи включались на компьютере (по анонимному номеру компьютера), — чтобы новый ключ вместо продления не считался приглашением."],
 ["Статистика запусков", "При каждом запуске программа вместе с запросом цен отправляет на наш сервер ключей: случайный номер установки (создаётся один раз на твоём компьютере; это не номер компьютера и с ним не связан), версию программы, язык интерфейса, откуда программа (Microsoft Store или наш сайт) и есть ли PRO. Ни имени, ни списка модов, ни сохранений. Сервер хранит только отпечаток номера установки (необратимый хэш, а не сам номер) и не хранит твой адрес в интернете; запуск считается не чаще раза в день, записи старше 90 дней удаляются сами. Это помогает понять, сколько людей пользуются программой. Выключить можно в любой момент в «Настройках»: «Отправлять обезличенную статистику запусков»."],
 ["Твой выбор", "Отчёты об ошибках выключаются в «Настройках» в любой момент. Сообщения, машинный перевод и включение PRO происходят только по твоему действию. Чтобы узнать, какие данные о тебе есть, или удалить их, напиши нам кнопкой в программе или в Telegram."],
 ["Дети", "Программа для игроков The Sims 4 (рейтинг T/PEGI 12). Мы сознательно не собираем данные детей младше 13 лет."],
 ["Безопасность", "Все данные передаются по защищённому соединению (HTTPS/TLS)."],
 ["Изменения", "Если политика изменится, мы обновим эту страницу и дату выше."]]},
pt: {title: "Política de Privacidade", updated: "Última atualização", sections: [
 ["Quem somos", "O Sims 4 Mod Doctor é um programa gratuito para Windows para jogadores de The Sims 4, feito por um desenvolvedor independente. Ele não é afiliado nem endossado pela Electronic Arts ou pela Maxis. Contato: o botão “Escrever ao desenvolvedor” no programa ou nossa comunidade no Telegram https://t.me/sims4moddoctor_chat."],
 ["O que fica no seu computador", "O programa trabalha localmente com as suas pastas Mods, Tray e de saves. Configurações, quarentena, backups e relatórios ficam armazenados no seu computador (em Documents\\Sims 4 Mod Doctor e nos dados locais do programa). Nada disso é enviado automaticamente."],
 ["O que é enviado, e somente quando", "1) Licença PRO: quando você ativa ou renova uma chave PRO, o programa envia a chave, um ID anônimo do computador (um hash, não o ID do Windows em si) e um rótulo curto como “Computador 1A2B” (feito a partir desse ID, não o nome real do computador) ao nosso servidor de licenças, para vincular a chave a um único computador. O programa também pede ao servidor os preços atuais.\n2) Compras: o pagamento é feito no Telegram por meio do @CryptoBot (Crypto Pay). Recebemos apenas o pedido, o plano, o valor e a chave emitida — nunca os seus dados de pagamento.\n3) Relatórios de erro: na versão da Microsoft Store — somente se você os ativar (o programa pergunta uma vez); na versão baixada do nosso site, eles vêm ativados por padrão depois que o programa avisa você, e você pode desativá-los em Configurações a qualquer momento. Um relatório contém o erro, a versão do programa e do jogo e a versão do Windows; o seu nome de usuário do Windows é removido dos caminhos; a lista de mods e de saves não é incluída. Os relatórios são processados pelo serviço Sentry.\n4) Mensagens ao desenvolvedor: somente quando você pressiona “Enviar” em “Escrever ao desenvolvedor”. A mensagem contém o seu texto, o contato que você informou (opcional), as capturas de tela anexadas e, se você marcar, o Relatório de ajuda (versão do jogo, lista de mods, erros recentes do jogo; o seu nome de usuário do Windows fica oculto). Ela é entregue ao desenvolvedor pelo Telegram.\n5) Tradução automática de mods: somente quando você a inicia, os textos do mod são enviados ao Google Translate ou ao DeepL (com a sua própria chave do DeepL).\n6) Convites de amigos: se você já abriu “🎁 Convide um amigo”, a cada 6 horas o programa pergunta ao servidor de licenças se alguém comprou pelo seu link e recebe os dias ganhos. São enviados o ID anônimo do computador, a sua chave (se houver) e o seu código de convite."],
 ["Como usamos", "Somente para oferecer as funções do programa: verificar licenças, entregar a sua chave, corrigir erros e responder às suas mensagens. Não vendemos nem compartilhamos os seus dados para publicidade, e o programa não tem anúncios nem rastreamento."],
 ["Por quanto tempo guardamos", "Registros de licença — enquanto a licença existir. Relatórios de erro — até 90 dias. Mensagens ao desenvolvedor — pelo tempo necessário para te ajudar; você pode pedir que sejam apagadas. Contadores de proteção contra força bruta (por uma impressão do endereço, não pelo endereço em si) — de minutos a um dia."],
 ["Convites de amigos", "Para que ninguém “convide” a si mesmo, o servidor de licenças guarda impressões digitais de endereços de internet (um hash irreversível com sal secreto, não o próprio endereço; no IPv6 — da parte de rede). Uma impressão é registrada: 1) se você tem um código de convite — quando o programa contata o servidor de licenças: ao abrir “Convide um amigo”, na verificação de convites a cada 6 horas e ao ativar ou renovar a chave; 2) se você compra uma chave nova pelo link ou código de um amigo — o endereço de onde a chave foi comprada. O endereço de onde o amigo ativa a chave é comparado com as impressões, mas não é salvo. Cada impressão é guardada por no máximo 60 dias a partir do registro: depois disso o servidor deixa de usá-la e a apaga, e registra uma nova no próximo contato. O servidor também lembra quais chaves foram ativadas em um computador (pelo ID anônimo do computador), para que uma chave nova comprada no lugar de uma renovação não conte como convite."],
 ["Estatísticas de uso", "Sempre que o programa é aberto, junto com a consulta de preços, ele envia ao nosso servidor de licenças: um número aleatório da instalação (criado uma única vez no seu computador; não é o ID do computador e não tem ligação com ele), a versão do programa, o idioma da interface, de onde o programa veio (Microsoft Store ou nosso site) e se o PRO está ativo. Nada de nome, lista de mods ou saves. O servidor guarda apenas uma impressão digital do número da instalação (um hash irreversível, não o número em si) e não guarda seu endereço de internet; cada abertura é contada no máximo uma vez por dia, e registros com mais de 90 dias são apagados automaticamente. Isso nos ajuda a saber quantas pessoas usam o programa. Você pode desativar a qualquer momento em Configurações: “Enviar estatísticas anônimas de uso”."],
 ["Suas escolhas", "Os relatórios de erro podem ser desativados a qualquer momento em Configurações. O envio de mensagens, a tradução automática e a ativação do PRO só acontecem quando você os faz. Para pedir acesso aos seus dados ou a exclusão deles, escreva para nós pelo botão do programa ou pelo Telegram."],
 ["Crianças", "O programa é destinado a jogadores de The Sims 4 (classificação T/PEGI 12). Não coletamos intencionalmente dados pessoais de crianças com menos de 13 anos."],
 ["Segurança", "Todos os dados são enviados por conexões criptografadas (HTTPS/TLS)."],
 ["Alterações", "Se esta política mudar, atualizaremos esta página e a data acima."]]},
es: {title: "Política de privacidad", updated: "Última actualización", sections: [
 ["Quiénes somos", "Sims 4 Mod Doctor es un programa gratuito para Windows para jugadores de Los Sims 4, creado por un desarrollador independiente. No está afiliado ni respaldado por Electronic Arts ni Maxis. Contacto: el botón «Escribir al desarrollador» del programa o nuestra comunidad de Telegram https://t.me/sims4moddoctor_chat."],
 ["Qué se queda en tu ordenador", "El programa trabaja de forma local con tus carpetas Mods, Tray y de partidas guardadas. Los ajustes, la cuarentena, las copias de seguridad y los informes se guardan en tu ordenador (en Documents\\Sims 4 Mod Doctor y en los datos locales del programa). Nada de eso se envía automáticamente."],
 ["Qué se envía, y solo cuándo", "1) Licencia PRO: cuando activas o renuevas una clave PRO, el programa envía la clave, un ID anónimo del equipo (un hash, no el ID de Windows en sí) y una etiqueta corta como «Equipo 1A2B» (hecha a partir de ese ID, no el nombre real del equipo) a nuestro servidor de licencias, para vincular la clave a un solo equipo. El programa también consulta al servidor los precios actuales.\n2) Compras: el pago se hace en Telegram mediante @CryptoBot (Crypto Pay). Solo recibimos el pedido, el plan, el importe y la clave emitida; nunca tus datos de pago.\n3) Informes de errores: en la versión de Microsoft Store, solo si los activas (el programa te lo pregunta una vez); en la versión descargada de nuestro sitio web vienen activados por defecto después de que el programa te lo comunique, y puedes desactivarlos en Ajustes en cualquier momento. Un informe contiene el error, la versión del programa y del juego y la versión de Windows; tu nombre de usuario de Windows se elimina de las rutas; no se incluye la lista de mods ni de partidas. Los informes los procesa el servicio Sentry.\n4) Mensajes al desarrollador: solo cuando pulsas «Enviar» en «Escribir al desarrollador». El mensaje contiene tu texto, el contacto que indicaste (opcional), las capturas de pantalla adjuntas y, si lo marcas, el Informe para ayuda (versión del juego, lista de mods, errores recientes del juego; tu nombre de usuario de Windows queda oculto). Se entrega al desarrollador a través de Telegram.\n5) Traducción automática de mods: solo cuando la inicias, los textos del mod se envían a Google Translate o DeepL (con tu propia clave de DeepL).\n6) Invitaciones de amigos: si alguna vez abriste «🎁 Invita a un amigo», cada 6 horas el programa pregunta al servidor de licencias si alguien compró con tu enlace y recoge los días ganados. Se envían el ID anónimo del equipo, tu clave (si la tienes) y tu código de invitación."],
 ["Cómo lo usamos", "Solo para ofrecer las funciones del programa: comprobar licencias, entregar tu clave, corregir errores y responder a tus mensajes. No vendemos ni compartimos tus datos con fines publicitarios, y el programa no tiene anuncios ni rastreo."],
 ["Cuánto tiempo lo conservamos", "Registros de licencia: mientras exista la licencia. Informes de errores: hasta 90 días. Mensajes al desarrollador: el tiempo necesario para ayudarte; puedes pedirnos que los borremos. Contadores de protección contra la fuerza bruta (por una huella de la dirección, no por la dirección en sí): de minutos a un día."],
 ["Invitaciones de amigos", "Para que nadie se «invite» a sí mismo, el servidor de licencias guarda huellas de direcciones de internet (un hash irreversible con sal secreta, no la dirección en sí; en IPv6, de su parte de red). Una huella se registra: 1) si tienes un código de invitación, cuando el programa contacta con el servidor de licencias: al abrir «Invita a un amigo», en la comprobación de invitaciones cada 6 horas y al activar o renovar la clave; 2) si compras una clave nueva con el enlace o el código de un amigo, la dirección desde la que se compró. La dirección desde la que el amigo activa la clave se compara con las huellas, pero no se guarda. Cada huella se conserva como máximo 60 días desde que se registró: después el servidor deja de usarla y la borra, y registra una nueva en el siguiente contacto. El servidor también recuerda qué claves se activaron en un equipo (por el ID anónimo del equipo), para que una clave nueva comprada en lugar de una renovación no cuente como invitación."],
 ["Estadísticas de inicio", "Cada vez que se abre el programa, junto con la consulta de precios, envía a nuestro servidor de licencias: un número aleatorio de instalación (se crea una sola vez en tu ordenador; no es el ID del ordenador ni está vinculado a él), la versión del programa, el idioma de la interfaz, de dónde procede el programa (Microsoft Store o nuestra web) y si tienes PRO. Ni nombre, ni lista de mods, ni partidas guardadas. El servidor guarda solo una huella del número de instalación (un hash irreversible, no el número en sí) y no guarda tu dirección de internet; cada inicio se cuenta como máximo una vez al día y los registros de más de 90 días se borran solos. Nos ayuda a saber cuántas personas usan el programa. Puedes desactivarlo en cualquier momento en Ajustes: «Enviar estadísticas anónimas de inicio»."],
 ["Tus opciones", "Los informes de errores se pueden desactivar en cualquier momento en Ajustes. El envío de mensajes, la traducción automática y la activación de PRO solo ocurren cuando tú los haces. Para solicitar acceso a tus datos o su eliminación, escríbenos con el botón del programa o por Telegram."],
 ["Menores", "El programa está pensado para jugadores de Los Sims 4 (clasificación T/PEGI 12). No recopilamos a sabiendas datos personales de menores de 13 años."],
 ["Seguridad", "Todos los datos se envían mediante conexiones cifradas (HTTPS/TLS)."],
 ["Cambios", "Si esta política cambia, actualizaremos esta página y la fecha de arriba."]]},
de: {title: "Datenschutzerklärung", updated: "Zuletzt aktualisiert", sections: [
 ["Wer wir sind", "Sims 4 Mod Doctor ist ein kostenloses Windows-Programm für Spieler von Die Sims 4, entwickelt von einem unabhängigen Entwickler. Es steht in keiner Verbindung zu Electronic Arts oder Maxis und wird von ihnen nicht unterstützt. Kontakt: die Schaltfläche „An den Entwickler schreiben“ im Programm oder unsere Telegram-Community https://t.me/sims4moddoctor_chat."],
 ["Was auf deinem Computer bleibt", "Das Programm arbeitet lokal mit deinen Ordnern Mods, Tray und Spielstände. Einstellungen, Quarantäne, Sicherungen und Berichte werden auf deinem Computer gespeichert (in Documents\\Sims 4 Mod Doctor und in den lokalen Programmdaten). Nichts davon wird automatisch hochgeladen."],
 ["Was gesendet wird, und nur wann", "1) PRO-Lizenz: Wenn du einen PRO-Schlüssel aktivierst oder erneuerst, sendet das Programm den Schlüssel, eine anonyme Computer-ID (ein Hash, nicht die Windows-ID selbst) und eine kurze Bezeichnung wie „Computer 1A2B“ (aus dieser ID gebildet, nicht der echte Computername) an unseren Lizenzserver, um den Schlüssel an einen Computer zu binden. Außerdem fragt das Programm beim Server die aktuellen Preise ab.\n2) Käufe: Die Zahlung erfolgt in Telegram über @CryptoBot (Crypto Pay). Wir erhalten nur Bestellung, Tarif, Betrag und den ausgestellten Schlüssel – niemals deine Zahlungsdaten.\n3) Fehlerberichte: In der Version aus dem Microsoft Store nur, wenn du sie einschaltest (das Programm fragt einmal nach); in der von unserer Website heruntergeladenen Version sind sie standardmäßig eingeschaltet, nachdem das Programm dich darüber informiert hat, und du kannst sie jederzeit in den Einstellungen ausschalten. Ein Bericht enthält den Fehler, die Programm- und Spielversion sowie die Windows-Version; dein Windows-Benutzername wird aus Pfaden entfernt; die Liste der Mods und Spielstände ist nicht enthalten. Die Berichte werden vom Dienst Sentry verarbeitet.\n4) Nachrichten an den Entwickler: nur, wenn du in „An den Entwickler schreiben“ auf „Senden“ drückst. Die Nachricht enthält deinen Text, den von dir eingegebenen Kontakt (optional), die angehängten Screenshots und, wenn du es ankreuzt, den Hilfebericht (Spielversion, Mod-Liste, aktuelle Spielfehler; dein Windows-Benutzername wird verborgen). Sie wird über Telegram an den Entwickler zugestellt.\n5) Maschinelle Übersetzung von Mods: nur wenn du sie startest, werden die Mod-Texte an Google Translate oder DeepL gesendet (mit deinem eigenen DeepL-Schlüssel).\n6) Einladungen von Freunden: Wenn du „🎁 Lade einen Freund ein“ schon einmal geöffnet hast, fragt das Programm alle 6 Stunden beim Lizenzserver nach, ob jemand über deinen Link gekauft hat, und holt die verdienten Tage ab. Gesendet werden die anonyme Computer-ID, dein Schlüssel (falls vorhanden) und dein Einladungscode."],
 ["Wie wir sie verwenden", "Nur um die Funktionen des Programms bereitzustellen: Lizenzen prüfen, deinen Schlüssel zustellen, Fehler beheben und deine Nachrichten beantworten. Wir verkaufen oder teilen deine Daten nicht für Werbung, und das Programm enthält weder Werbung noch Tracking."],
 ["Wie lange wir sie speichern", "Lizenzdaten – solange die Lizenz besteht. Fehlerberichte – bis zu 90 Tage. Nachrichten an den Entwickler – so lange, wie nötig, um dir zu helfen; du kannst uns bitten, sie zu löschen. Zähler zum Schutz vor Durchprobieren (über einen Fingerabdruck der Adresse, nicht die Adresse selbst) – von Minuten bis zu einem Tag."],
 ["Einladungen von Freunden", "Damit sich niemand selbst „einlädt“, speichert der Lizenzserver Fingerabdrücke von Internetadressen (einen nicht umkehrbaren Hash mit geheimem Salt, nicht die Adresse selbst; bei IPv6 – ihres Netzwerkteils). Ein Fingerabdruck wird gespeichert: 1) wenn du einen Einladungscode hast – sobald das Programm den Lizenzserver kontaktiert: beim Öffnen von „Lade einen Freund ein“, bei der Einladungsprüfung alle 6 Stunden sowie beim Aktivieren und Erneuern des Schlüssels; 2) wenn du über den Link oder Code eines Freundes einen neuen Schlüssel kaufst – die Adresse, von der gekauft wurde. Die Adresse, von der ein Freund seinen Schlüssel aktiviert, wird mit den Fingerabdrücken verglichen, aber nicht gespeichert. Jeder Fingerabdruck wird höchstens 60 Tage ab seiner Speicherung aufbewahrt: Danach verwendet der Server ihn nicht mehr und löscht ihn; beim nächsten Kontakt wird ein neuer gespeichert. Außerdem merkt sich der Server, welche Schlüssel auf einem Computer aktiviert wurden (über die anonyme Computer-ID), damit ein neuer Schlüssel statt einer Verlängerung nicht als Einladung zählt."],
 ["Startstatistik", "Bei jedem Start sendet das Programm zusammen mit der Preisabfrage an unseren Lizenzserver: eine zufällige Installationsnummer (wird einmalig auf deinem Computer erstellt; sie ist nicht die Computer-ID und nicht mit ihr verknüpft), die Programmversion, die Sprache der Oberfläche, woher das Programm stammt (Microsoft Store oder unsere Website) und ob PRO aktiv ist. Kein Name, keine Mod-Liste, keine Spielstände. Der Server speichert nur einen Fingerabdruck der Installationsnummer (einen nicht umkehrbaren Hash, nicht die Nummer selbst) und speichert deine Internetadresse nicht; ein Start wird höchstens einmal pro Tag gezählt, Einträge älter als 90 Tage werden automatisch gelöscht. So sehen wir, wie viele Menschen das Programm nutzen. Abschalten kannst du das jederzeit in den Einstellungen: „Anonyme Startstatistik senden“."],
 ["Deine Wahlmöglichkeiten", "Fehlerberichte kannst du jederzeit in den Einstellungen ausschalten. Das Senden von Nachrichten, die maschinelle Übersetzung und die PRO-Aktivierung geschehen nur, wenn du sie auslöst. Um Auskunft über deine Daten oder deren Löschung zu verlangen, schreib uns über die Schaltfläche im Programm oder über Telegram."],
 ["Kinder", "Das Programm richtet sich an Spieler von Die Sims 4 (Einstufung T/PEGI 12). Wir erheben wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren."],
 ["Sicherheit", "Alle Daten werden über verschlüsselte Verbindungen (HTTPS/TLS) übertragen."],
 ["Änderungen", "Wenn sich diese Richtlinie ändert, aktualisieren wir diese Seite und das obige Datum."]]},
fr: {title: "Politique de confidentialité", updated: "Dernière mise à jour", sections: [
 ["Qui nous sommes", "Sims 4 Mod Doctor est un programme Windows gratuit pour les joueurs des Sims 4, créé par un développeur indépendant. Il n'est ni affilié à Electronic Arts ou Maxis, ni approuvé par eux. Contact : le bouton « Écrire au développeur » dans le programme ou notre communauté Telegram https://t.me/sims4moddoctor_chat."],
 ["Ce qui reste sur ton ordinateur", "Le programme travaille en local avec tes dossiers Mods, Tray et de sauvegardes. Les paramètres, la quarantaine, les copies de sauvegarde et les rapports sont stockés sur ton ordinateur (dans Documents\\Sims 4 Mod Doctor et dans les données locales du programme). Rien de tout cela n'est envoyé automatiquement."],
 ["Ce qui est envoyé, et seulement quand", "1) Licence PRO : quand tu actives ou renouvelles une clé PRO, le programme envoie la clé, un identifiant anonyme de l'ordinateur (un hash, pas l'identifiant Windows lui-même) et une courte étiquette comme « Ordinateur 1A2B » (tirée de cet identifiant, pas le vrai nom de l'ordinateur) à notre serveur de licences, pour lier la clé à un seul ordinateur. Le programme demande aussi les prix actuels au serveur.\n2) Achats : le paiement se fait dans Telegram via @CryptoBot (Crypto Pay). Nous recevons uniquement la commande, l'offre, le montant et la clé délivrée — jamais tes données de paiement.\n3) Rapports d'erreurs : dans la version du Microsoft Store, uniquement si tu les actives (le programme te demande une seule fois) ; dans la version téléchargée depuis notre site, ils sont activés par défaut après que le programme t'en a informé, et tu peux les désactiver dans Paramètres à tout moment. Un rapport contient l'erreur, la version du programme et du jeu et la version de Windows ; ton nom d'utilisateur Windows est retiré des chemins ; la liste des mods et des sauvegardes n'est pas incluse. Les rapports sont traités par le service Sentry.\n4) Messages au développeur : uniquement quand tu appuies sur « Envoyer » dans « Écrire au développeur ». Le message contient ton texte, le contact que tu as saisi (facultatif), les captures d'écran jointes et, si tu la coches, le Rapport d'aide (version du jeu, liste des mods, erreurs récentes du jeu ; ton nom d'utilisateur Windows est masqué). Il est transmis au développeur via Telegram.\n5) Traduction automatique des mods : uniquement quand tu la lances, les textes du mod sont envoyés à Google Translate ou DeepL (avec ta propre clé DeepL).\n6) Invitations d'amis : si tu as déjà ouvert « 🎁 Invite un ami », toutes les 6 heures le programme demande au serveur de licences si quelqu'un a acheté avec ton lien et récupère les jours gagnés. Sont envoyés l'identifiant anonyme de l'ordinateur, ta clé (si tu en as une) et ton code d'invitation."],
 ["Comment nous l'utilisons", "Uniquement pour fournir les fonctions du programme : vérifier les licences, livrer ta clé, corriger les erreurs et répondre à tes messages. Nous ne vendons ni ne partageons tes données à des fins publicitaires, et le programme ne contient ni publicité ni suivi."],
 ["Combien de temps nous les conservons", "Enregistrements de licence — tant que la licence existe. Rapports d'erreurs — jusqu'à 90 jours. Messages au développeur — le temps nécessaire pour t'aider ; tu peux nous demander de les supprimer. Compteurs de protection contre les essais en masse (par une empreinte de l'adresse, pas l'adresse elle-même) — de quelques minutes à un jour."],
 ["Invitations d'amis", "Pour que personne ne s'« invite » soi-même, le serveur de licences garde des empreintes d'adresses internet (un hachage irréversible avec un sel secret, pas l'adresse elle-même ; en IPv6 — de sa partie réseau). Une empreinte est enregistrée : 1) si tu as un code d'invitation — quand le programme contacte le serveur de licences : à l'ouverture de « Invite un ami », lors de la vérification des invitations toutes les 6 heures, et quand ta clé est activée ou renouvelée ; 2) si tu achètes une nouvelle clé avec le lien ou le code d'un ami — l'adresse depuis laquelle la clé a été achetée. L'adresse depuis laquelle un ami active sa clé est comparée aux empreintes, mais n'est pas enregistrée. Chaque empreinte est conservée 60 jours au maximum à partir de son enregistrement : ensuite le serveur ne l'utilise plus et la supprime, puis en enregistre une nouvelle au contact suivant. Le serveur se souvient aussi des clés activées sur un ordinateur (par l'identifiant anonyme de l'ordinateur), pour qu'une nouvelle clé achetée à la place d'un renouvellement ne compte pas comme une invitation."],
 ["Statistiques de lancement", "À chaque lancement, en même temps que la demande des prix, le programme envoie à notre serveur de licences : un numéro d'installation aléatoire (créé une seule fois sur ton ordinateur ; ce n'est pas l'identifiant de l'ordinateur et il n'y est pas lié), la version du programme, la langue de l'interface, la provenance du programme (Microsoft Store ou notre site) et si PRO est actif. Ni nom, ni liste de mods, ni sauvegardes. Le serveur ne garde qu'une empreinte du numéro d'installation (un hachage irréversible, pas le numéro lui-même) et ne conserve pas ton adresse internet ; un lancement est compté au plus une fois par jour et les données de plus de 90 jours sont supprimées automatiquement. Cela nous aide à savoir combien de personnes utilisent le programme. Tu peux le désactiver à tout moment dans Paramètres : « Envoyer des statistiques de lancement anonymes »."],
 ["Tes choix", "Les rapports d'erreurs peuvent être désactivés à tout moment dans Paramètres. L'envoi de messages, la traduction automatique et l'activation PRO n'ont lieu que lorsque tu les déclenches. Pour demander l'accès à tes données ou leur suppression, écris-nous via le bouton du programme ou sur Telegram."],
 ["Enfants", "Le programme est destiné aux joueurs des Sims 4 (classé T/PEGI 12). Nous ne collectons pas sciemment de données personnelles d'enfants de moins de 13 ans."],
 ["Sécurité", "Toutes les données sont envoyées via des connexions chiffrées (HTTPS/TLS)."],
 ["Modifications", "Si cette politique change, nous mettrons à jour cette page et la date ci-dessus."]]},
pl: {title: "Polityka prywatności", updated: "Ostatnia aktualizacja", sections: [
 ["Kim jesteśmy", "Sims 4 Mod Doctor to darmowy program dla Windows dla graczy The Sims 4, stworzony przez niezależnego twórcę. Nie jest powiązany z Electronic Arts ani Maxis ani przez nie popierany. Kontakt: przycisk „Napisz do twórcy” w programie lub nasza społeczność na Telegramie https://t.me/sims4moddoctor_chat."],
 ["Co zostaje na twoim komputerze", "Program działa lokalnie na twoich folderach Mods, Tray i zapisów gry. Ustawienia, kwarantanna, kopie zapasowe i raporty są przechowywane na twoim komputerze (w Documents\\Sims 4 Mod Doctor oraz w lokalnych danych programu). Nic z tego nie jest wysyłane automatycznie."],
 ["Co jest wysyłane i tylko kiedy", "1) Licencja PRO: gdy aktywujesz lub odświeżasz klucz PRO, program wysyła klucz, anonimowy identyfikator komputera (hasz, a nie sam identyfikator Windows) i krótką etykietę w rodzaju „Komputer 1A2B” (utworzoną z tego identyfikatora, a nie prawdziwą nazwę komputera) na nasz serwer licencji, aby powiązać klucz z jednym komputerem. Program pyta też serwer o aktualne ceny.\n2) Zakupy: płatność odbywa się w Telegramie przez @CryptoBot (Crypto Pay). Otrzymujemy tylko zamówienie, plan, kwotę i wydany klucz — nigdy twoich danych płatniczych.\n3) Raporty błędów: w wersji z Microsoft Store — tylko jeśli je włączysz (program zapyta raz); w wersji pobranej z naszej strony są domyślnie włączone po tym, jak program cię o tym poinformuje, a w Ustawieniach możesz je wyłączyć w dowolnej chwili. Raport zawiera błąd, wersję programu i gry oraz wersję Windows; twoja nazwa użytkownika Windows jest usuwana ze ścieżek; lista modów i zapisów gry nie jest dołączana. Raporty przetwarza usługa Sentry.\n4) Wiadomości do twórcy: tylko gdy naciśniesz „Wyślij” w „Napisz do twórcy”. Wiadomość zawiera twój tekst, podany przez ciebie kontakt (opcjonalnie), dołączone zrzuty ekranu oraz, jeśli to zaznaczysz, Raport dla pomocy (wersja gry, lista modów, ostatnie błędy gry; twoja nazwa użytkownika Windows jest ukryta). Trafia do twórcy przez Telegram.\n5) Automatyczne tłumaczenie modów: tylko gdy je uruchomisz, teksty moda są wysyłane do Google Translate lub DeepL (z twoim własnym kluczem DeepL).\n6) Zaproszenia znajomych: jeśli choć raz otworzyłeś „🎁 Zaproś znajomego”, co 6 godzin program pyta serwer licencji, czy ktoś kupił z twojego linku, i odbiera zdobyte dni. Wysyłane są anonimowy identyfikator komputera, twój klucz (jeśli go masz) i twój kod zaproszenia."],
 ["Jak tego używamy", "Tylko po to, by zapewnić funkcje programu: sprawdzać licencje, dostarczać twój klucz, naprawiać błędy i odpowiadać na twoje wiadomości. Nie sprzedajemy ani nie udostępniamy twoich danych w celach reklamowych, a program nie zawiera reklam ani śledzenia."],
 ["Jak długo je przechowujemy", "Dane licencji — dopóki licencja istnieje. Raporty błędów — do 90 dni. Wiadomości do twórcy — tak długo, jak trzeba, by ci pomóc; możesz poprosić o ich usunięcie. Liczniki ochrony przed zgadywaniem (po odcisku adresu, a nie samym adresie) — od kilku minut do doby."],
 ["Zaproszenia od znajomych", "Żeby nikt nie „zapraszał” sam siebie, serwer licencji przechowuje odciski adresów internetowych (nieodwracalny skrót z tajną solą, a nie sam adres; dla IPv6 — jego części sieciowej). Odcisk jest zapisywany: 1) jeśli masz kod zaproszenia — gdy program łączy się z serwerem licencji: przy otwarciu „Zaproś znajomego”, przy sprawdzaniu zaproszeń co 6 godzin oraz przy włączaniu i odświeżaniu klucza; 2) jeśli kupujesz nowy klucz z linku lub kodu znajomego — adres, z którego kupiono klucz. Adres, z którego znajomy włącza klucz, jest porównywany z odciskami, ale nie jest zapisywany. Każdy odcisk jest przechowywany najwyżej 60 dni od zapisania: potem serwer przestaje go używać i go usuwa, a przy następnym połączeniu zapisuje nowy. Serwer pamięta też, jakie klucze włączano na komputerze (po anonimowym identyfikatorze komputera), żeby nowy klucz kupiony zamiast przedłużenia nie liczył się jako zaproszenie."],
 ["Statystyki uruchomień", "Przy każdym uruchomieniu program razem z zapytaniem o ceny wysyła na nasz serwer licencji: losowy numer instalacji (tworzony raz na twoim komputerze; to nie jest identyfikator komputera i nie jest z nim powiązany), wersję programu, język interfejsu, skąd pochodzi program (Microsoft Store lub nasza strona) i czy masz PRO. Bez imienia, listy modów i zapisów gry. Serwer przechowuje tylko odcisk numeru instalacji (nieodwracalny skrót, a nie sam numer) i nie przechowuje twojego adresu internetowego; uruchomienie liczone jest najwyżej raz dziennie, a wpisy starsze niż 90 dni usuwają się same. Dzięki temu wiemy, ile osób korzysta z programu. Możesz to wyłączyć w dowolnej chwili w Ustawieniach: „Wysyłaj anonimowe statystyki uruchomień”."],
 ["Twoje wybory", "Raporty błędów możesz wyłączyć w dowolnej chwili w Ustawieniach. Wysyłanie wiadomości, automatyczne tłumaczenie i aktywacja PRO odbywają się tylko wtedy, gdy sam je uruchomisz. Aby poprosić o dostęp do swoich danych lub ich usunięcie, napisz do nas przyciskiem w programie lub przez Telegram."],
 ["Dzieci", "Program jest przeznaczony dla graczy The Sims 4 (klasyfikacja T/PEGI 12). Świadomie nie zbieramy danych osobowych dzieci poniżej 13 roku życia."],
 ["Bezpieczeństwo", "Wszystkie dane są przesyłane szyfrowanymi połączeniami (HTTPS/TLS)."],
 ["Zmiany", "Jeśli ta polityka ulegnie zmianie, zaktualizujemy tę stronę i powyższą datę."]]},
it: {title: "Informativa sulla privacy", updated: "Ultimo aggiornamento", sections: [
 ["Chi siamo", "Sims 4 Mod Doctor è un programma gratuito per Windows per i giocatori di The Sims 4, creato da uno sviluppatore indipendente. Non è affiliato né approvato da Electronic Arts o Maxis. Contatto: il pulsante «Scrivi allo sviluppatore» nel programma oppure la nostra community Telegram https://t.me/sims4moddoctor_chat."],
 ["Cosa resta sul tuo computer", "Il programma lavora in locale con le tue cartelle Mods, Tray e dei salvataggi. Impostazioni, quarantena, backup e report sono archiviati sul tuo computer (in Documents\\Sims 4 Mod Doctor e nei dati locali del programma). Niente di tutto ciò viene caricato automaticamente."],
 ["Cosa viene inviato, e solo quando", "1) Licenza PRO: quando attivi o rinnovi una chiave PRO, il programma invia la chiave, un ID anonimo del computer (un hash, non l'ID di Windows stesso) e una breve etichetta come «Computer 1A2B» (ricavata da quell'ID, non il vero nome del computer) al nostro server delle licenze, per associare la chiave a un solo computer. Il programma chiede inoltre al server i prezzi attuali.\n2) Acquisti: il pagamento avviene su Telegram tramite @CryptoBot (Crypto Pay). Riceviamo solo l'ordine, il piano, l'importo e la chiave emessa — mai i tuoi dati di pagamento.\n3) Report degli errori: nella versione del Microsoft Store — solo se li attivi (il programma te lo chiede una volta); nella versione scaricata dal nostro sito sono attivi per impostazione predefinita dopo che il programma te lo ha comunicato, e puoi disattivarli nelle Impostazioni in qualsiasi momento. Un report contiene l'errore, la versione del programma e del gioco e la versione di Windows; il tuo nome utente di Windows viene rimosso dai percorsi; l'elenco di mod e salvataggi non è incluso. I report sono elaborati dal servizio Sentry.\n4) Messaggi allo sviluppatore: solo quando premi «Invia» in «Scrivi allo sviluppatore». Il messaggio contiene il tuo testo, il contatto che hai inserito (facoltativo), gli screenshot allegati e, se lo spunti, il Report per l'assistenza (versione del gioco, elenco delle mod, errori recenti del gioco; il tuo nome utente di Windows è nascosto). Viene consegnato allo sviluppatore tramite Telegram.\n5) Traduzione automatica delle mod: solo quando la avvii, i testi della mod vengono inviati a Google Translate o DeepL (con la tua chiave DeepL personale).\n6) Inviti degli amici: se hai aperto almeno una volta «🎁 Invita un amico», ogni 6 ore il programma chiede al server delle licenze se qualcuno ha comprato con il tuo link e ritira i giorni guadagnati. Vengono inviati l'ID anonimo del computer, la tua chiave (se ce l'hai) e il tuo codice d'invito."],
 ["Come li usiamo", "Solo per fornire le funzioni del programma: verificare le licenze, consegnare la tua chiave, correggere gli errori e rispondere ai tuoi messaggi. Non vendiamo né condividiamo i tuoi dati per scopi pubblicitari, e il programma non contiene pubblicità né tracciamento."],
 ["Per quanto tempo li conserviamo", "Dati della licenza — finché la licenza esiste. Report degli errori — fino a 90 giorni. Messaggi allo sviluppatore — per il tempo necessario ad aiutarti; puoi chiederci di eliminarli. Contatori di protezione dai tentativi a raffica (tramite un'impronta dell'indirizzo, non l'indirizzo stesso) — da pochi minuti a un giorno."],
 ["Inviti degli amici", "Perché nessuno «inviti» se stesso, il server delle licenze conserva impronte di indirizzi internet (un hash irreversibile con un sale segreto, non l'indirizzo stesso; per IPv6 — della sua parte di rete). Un'impronta viene registrata: 1) se hai un codice d'invito — quando il programma contatta il server delle licenze: all'apertura di «Invita un amico», durante il controllo degli inviti ogni 6 ore e quando la chiave viene attivata o rinnovata; 2) se compri una nuova chiave con il link o il codice di un amico — l'indirizzo da cui è stata comprata. L'indirizzo da cui un amico attiva la chiave viene confrontato con le impronte, ma non viene salvato. Ogni impronta è conservata al massimo 60 giorni dalla registrazione: dopo il server non la usa più e la cancella, e ne registra una nuova al contatto successivo. Il server ricorda anche quali chiavi sono state attivate su un computer (tramite l'ID anonimo del computer), così una nuova chiave comprata al posto di un rinnovo non conta come invito."],
 ["Statistiche di avvio", "A ogni avvio, insieme alla richiesta dei prezzi, il programma invia al nostro server delle licenze: un numero di installazione casuale (creato una sola volta sul tuo computer; non è l'ID del computer e non è collegato a esso), la versione del programma, la lingua dell'interfaccia, da dove proviene il programma (Microsoft Store o il nostro sito) e se hai PRO. Niente nome, elenco delle mod o salvataggi. Il server conserva solo un'impronta del numero di installazione (un hash irreversibile, non il numero stesso) e non conserva il tuo indirizzo internet; un avvio viene contato al massimo una volta al giorno e i dati più vecchi di 90 giorni si cancellano da soli. Ci aiuta a capire quante persone usano il programma. Puoi disattivarlo in qualsiasi momento nelle Impostazioni: «Invia statistiche di avvio anonime»."],
 ["Le tue scelte", "I report degli errori possono essere disattivati in qualsiasi momento nelle Impostazioni. L'invio di messaggi, la traduzione automatica e l'attivazione PRO avvengono solo quando li esegui tu. Per chiedere l'accesso ai tuoi dati o la loro cancellazione, scrivici con il pulsante nel programma o su Telegram."],
 ["Minori", "Il programma è pensato per i giocatori di The Sims 4 (classificato T/PEGI 12). Non raccogliamo consapevolmente dati personali di minori di 13 anni."],
 ["Sicurezza", "Tutti i dati vengono inviati tramite connessioni crittografate (HTTPS/TLS)."],
 ["Modifiche", "Se questa informativa cambia, aggiorneremo questa pagina e la data qui sopra."]]},
uk: {title: "Політика конфіденційності", updated: "Оновлено", sections: [
 ["Хто ми", "Sims 4 Mod Doctor — безкоштовна програма для Windows для гравців The Sims 4 від незалежного розробника. Вона не пов'язана з Electronic Arts чи Maxis і не схвалена ними. Зв'язок: кнопка «Написати розробнику» в програмі або наша спільнота в Telegram https://t.me/sims4moddoctor_chat."],
 ["Що залишається на твоєму комп'ютері", "Програма працює з папками Mods, Tray і збереженнями на твоєму комп'ютері. Налаштування, карантин, копії та звіти зберігаються на комп'ютері (у Documents\\Sims 4 Mod Doctor і в локальних даних програми). Самі по собі вони нікуди не надсилаються."],
 ["Що надсилається і тільки коли", "1) PRO-ключ: під час увімкнення або оновлення ключа програма надсилає на наш сервер ліцензій сам ключ, анонімний номер комп'ютера (геш, а не сам ідентифікатор Windows) та короткий підпис на кшталт «Комп'ютер 1A2B» (з того ж номера, а не справжнє ім'я комп'ютера) — щоб прив'язати ключ до одного комп'ютера. Також програма запитує в сервера поточні ціни.\n2) Покупка: оплата відбувається в Telegram через @CryptoBot (Crypto Pay). Ми отримуємо лише замовлення, тариф, суму та виданий ключ — платіжних даних ми не бачимо.\n3) Звіти про помилки: у версії з Microsoft Store — тільки якщо ти їх увімкнеш (програма запитає один раз); у версії з нашого сайту вони ввімкнені за замовчуванням після повідомлення про це, а вимкнути їх можна в «Налаштуваннях» у будь-який момент. У звіті — помилка, версія програми, гри та Windows; ім'я користувача Windows зі шляхів прибрано; список модів і збережень не входить. Звіти обробляє сервіс Sentry.\n4) Повідомлення розробнику: тільки коли ти натискаєш «Надіслати» в «Написати розробнику». У повідомленні — твій текст, контакт (якщо вказав(-ла)), прикріплені скриншоти і, якщо позначено, Звіт для допомоги (версія гри, список модів, свіжі помилки гри; ім'я користувача Windows приховано). Воно надходить розробнику через Telegram.\n5) Машинний переклад модів: тільки коли ти його запускаєш — тексти моду надсилаються до Google Translate або DeepL (з твоїм ключем DeepL).\n6) Запрошення друзів: якщо ти хоч раз відкривав(-ла) «🎁 Запроси друга», раз на 6 годин програма запитує сервер ключів, чи не купив хтось за твоїм посиланням, і забирає нараховані дні. Надсилаються анонімний номер комп'ютера, твій ключ (якщо є) і твій код запрошення."],
 ["Навіщо", "Лише щоб працювали функції програми: перевірка ключів, видача ключа, виправлення помилок і відповіді на твої повідомлення. Ми не продаємо дані й не передаємо їх для реклами; реклами та стеження в програмі немає."],
 ["Скільки зберігаємо", "Дані ключа — поки ключ існує. Звіти про помилки — до 90 днів. Повідомлення розробнику — поки вони потрібні, щоб допомогти; можна попросити видалити. Лічильники захисту від перебору (за відбитком адреси, а не самою адресою) — від кількох хвилин до доби."],
 ["Запрошення друзів", "Щоб людина не «запрошувала» сама себе, сервер ключів зберігає відбитки адрес в інтернеті (незворотний хеш із секретною сіллю, а не саму адресу; для IPv6 — її мережевої частини). Відбиток записується: 1) якщо в тебе є код запрошення — коли програма звертається до сервера ключів: під час відкриття «Запроси друга», під час перевірки запрошень раз на 6 годин, під час увімкнення й оновлення ключа; 2) якщо ти купуєш новий ключ за посиланням або кодом друга — адресу, з якої куплено ключ. Адреса, з якої друг вмикає ключ, порівнюється з відбитками, але не зберігається. Кожен відбиток зберігається не довше 60 днів від моменту запису: потім сервер його більше не враховує й видаляє, а під час наступного звернення записує новий. Ще сервер пам'ятає, які ключі вмикалися на комп'ютері (за анонімним номером комп'ютера), — щоб новий ключ замість продовження не вважався запрошенням."],
 ["Статистика запусків", "Під час кожного запуску програма разом із запитом цін надсилає на наш сервер ключів: випадковий номер встановлення (створюється один раз на твоєму комп'ютері; це не номер комп'ютера і з ним не пов'язаний), версію програми, мову інтерфейсу, звідки програма (Microsoft Store або наш сайт) і чи є PRO. Ні імені, ні списку модів, ні збережень. Сервер зберігає лише відбиток номера встановлення (незворотний хеш, а не сам номер) і не зберігає твою адресу в інтернеті; запуск рахується не частіше ніж раз на день, записи, старші за 90 днів, видаляються самі. Це допомагає зрозуміти, скільки людей користуються програмою. Вимкнути можна будь-коли в «Налаштуваннях»: «Надсилати знеособлену статистику запусків»."],
 ["Твій вибір", "Звіти про помилки вимикаються в «Налаштуваннях» будь-коли. Повідомлення, машинний переклад і активація PRO відбуваються лише за твоєю дією. Щоб дізнатися, які дані про тебе є, або видалити їх, напиши нам кнопкою в програмі або в Telegram."],
 ["Діти", "Програма для гравців The Sims 4 (рейтинг T/PEGI 12). Ми свідомо не збираємо дані дітей молодше 13 років."],
 ["Безпека", "Усі дані передаються захищеним з'єднанням (HTTPS/TLS)."],
 ["Зміни", "Якщо політика зміниться, ми оновимо цю сторінку та дату вище."]]},
};
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
let lang = q.get("lang"); if (!LANGS[lang]) { const b = String(navigator.language || "").toLowerCase().split("-")[0]; lang = ["ru", "be", "kk"].includes(b) ? "ru" : LANGS[b] ? b : "en"; }
const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const link = s => esc(s).replace(/https:\/\/[^\s<]+/g, u => `<a href="${u}">${u}</a>`).replace(/\n/g, "<br>");
function paint() {
  const L = T[lang] || T.en; document.documentElement.lang = T[lang] ? lang : "en";
  document.title = "Sims 4 Mod Doctor — " + L.title;
  $("#doc").innerHTML = `<h1>${esc(L.title)}</h1><p class="mut">${esc(L.updated)}: ${UPDATED}</p>` +
    L.sections.map(([h, p]) => `<section><h2>${esc(h)}</h2><p>${link(p)}</p></section>`).join("");
}
const sel = $("#lang");
sel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}"${k === lang ? " selected" : ""}>${v}</option>`).join("");
sel.onchange = () => { lang = sel.value; paint(); };
paint();
</script>
